<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cloud Resource Scheduler & Multi-Channel Alert Gateway{% endblock %}</title>
  <!-- Google Fonts: Plus Jakarta Sans (Headings & UI), Inter (Body), JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container"></div>

  {% block content %}{% endblock %}

  <!-- PC Audio Muted: Alert sounds are delivered exclusively to phone via ntfy push notification -->
  <script>
    window.playBuzzerAlarm = function() {
      // PC remains completely silent. Sound is routed to operator phone via ntfy.
    };
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
