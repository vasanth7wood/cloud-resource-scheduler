services:
  - type: web
    name: cloud-resource-scheduler
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE_FALLBACK
        value: "True"
      - key: USE_MOCK_AWS
        value: "True"
      - key: SCAN_INTERVAL_SECONDS
        value: "15"
      - key: GRACE_PERIOD_MINUTES
        value: "30"
      - key: NTFY_TOPIC
        value: vasanth_cloud_alerts
      - key: ALERT_PHONE_NUMBER
        value: "+919025903459"
